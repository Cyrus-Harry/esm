<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی منچ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(241,196,15,0.3);
        }
        .game-info {
            text-align: center;
            color: #ecf0f1;
            font-size: 16px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 10px;
        }
        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .player-badge {
            background: rgba(0,0,0,0.4);
            padding: 4px 14px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-badge .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #fff;
        }
        .player-badge.active {
            border: 2px solid #f1c40f;
            background: rgba(241,196,15,0.2);
        }
        .player-badge.finished {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: #f5e6ca;
            border-radius: 20px;
            border: 8px solid #8B7355;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
            padding: 6px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 1px;
            width: 100%;
            height: 100%;
        }
        .cell {
            background: #f5e6ca;
            border-radius: 2px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* رنگ‌بندی ستون‌های رنگی */
        .cell.home-red { background: #ff6b6b; }
        .cell.home-green { background: #69db7c; }
        .cell.home-yellow { background: #ffd43b; }
        .cell.home-blue { background: #4dabf7; }
        /* خانه‌های شروع */
        .cell.start-red { background: #ff6b6b; border: 2px solid #fff; }
        .cell.start-green { background: #69db7c; border: 2px solid #fff; }
        .cell.start-yellow { background: #ffd43b; border: 2px solid #fff; }
        .cell.start-blue { background: #4dabf7; border: 2px solid #fff; }
        /* خانه‌های امن */
        .cell.safe { background: #e599f7; border: 1px solid #be4bdb; }
        /* مرکز تخته (مثلث‌های رنگی) */
        .cell.center-red { background: #ff6b6b; }
        .cell.center-green { background: #69db7c; }
        .cell.center-yellow { background: #ffd43b; }
        .cell.center-blue { background: #4dabf7; }
        .cell .token {
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
        }
        .cell .token.multiple {
            width: 65%;
            height: 65%;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .cell .token.me {
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            border-color: #fff;
        }
        .dice-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .dice {
            font-size: 48px;
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 15px;
            color: #fff;
            min-width: 80px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-roll { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-leave { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-back { background: linear-gradient(135deg, #3498db, #2980b9); }
        .status {
            text-align: center;
            color: #ecf0f1;
            margin-top: 10px;
            font-size: 16px;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 8px;
        }
        .winner-msg {
            text-align: center;
            font-size: 24px;
            color: #f1c40f;
            font-weight: 900;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(241,196,15,0.5);
        }
        .color-select-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .color-select-overlay h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .color-select-overlay .timer {
            color: #f1c40f;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .color-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .color-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .color-option:hover { transform: scale(1.1); }
        .color-option.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .color-option.selected {
            border-color: #f1c40f;
            box-shadow: 0 0 30px rgba(241,196,15,0.6);
        }
        @media (max-width: 600px) {
            .game-container { padding: 10px; }
            .dice { font-size: 32px; padding: 5px 15px; min-width: 60px; }
            button { padding: 8px 16px; font-size: 14px; }
            .player-badge { font-size: 12px; padding: 2px 10px; }
            .color-option { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🎲 منچ</h1>
    <div class="game-info" id="gameInfo">در حال بارگذاری...</div>
    <div class="players-list" id="playersList"></div>
    <div class="board-wrapper">
        <div class="board" id="board"></div>
        <div class="color-select-overlay" id="colorSelectOverlay" style="display:none;">
            <h2>🎨 انتخاب رنگ</h2>
            <div class="timer" id="colorTimer">7</div>
            <div class="color-options" id="colorOptions"></div>
            <div style="color:#fff;margin-top:15px;font-size:14px;" id="colorStatus">یک رنگ انتخاب کنید</div>
        </div>
    </div>
    <div class="dice-area">
        <div class="dice" id="diceDisplay">🎲</div>
        <button class="btn-roll" id="rollBtn" onclick="handleRoll()">تاس بینداز</button>
    </div>
    <div class="actions">
        <button class="btn-leave" onclick="leaveGame()">🔙 خروج از بازی</button>
        <button class="btn-back" onclick="backToLobby()">🔙 لابی</button>
    </div>
    <div class="status" id="statusMessage"></div>
    <div id="winnerMessage" class="winner-msg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="api.js"></script>
<script>
    let gameId = new URLSearchParams(window.location.search).get('id');
    let currentGame = null;
    let currentUser = null;
    let gameRef = null;
    let myUid = null;
    let colorTimerInterval = null;

    window.onload = async () => {
        currentUser = await getCurrentUser();
        if (!currentUser) {
            window.location.href = 'index.html';
            return;
        }
        myUid = currentUser.id;
        if (!gameId) {
            alert('شناسه بازی پیدا نشد!');
            window.location.href = 'index.html';
            return;
        }
        gameRef = pollGame(gameId, updateGame);
        const game = await getGame(gameId);
        if (game) {
            renderGame(game);
            if (game.status === 'color_select') {
                startColorTimer(game);
            }
        } else {
            alert('بازی پیدا نشد');
            window.location.href = 'index.html';
        }
    };

    function updateGame(game) {
        if (!game) {
            alert('بازی حذف شد!');
            window.location.href = 'index.html';
            return;
        }
        currentGame = game;
        renderGame(game);
        if (game.status === 'color_select') {
            startColorTimer(game);
        }
        if (game.status === 'playing' && game.players[game.currentTurn]?.isBot) {
            setTimeout(() => {
                runBotTurn(gameId, game.currentTurn);
            }, 1200);
        }
    }

    function renderGame(game) {
        const board = document.getElementById('board');
        board.innerHTML = '';
        const path = game.boardPath || [];
        const size = 15;
        const colorMap = game.colorMap || {};
        const colorNames = ['red', 'green', 'yellow', 'blue'];
        const colorHex = ['#ff6b6b', '#69db7c', '#ffd43b', '#4dabf7'];

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;

                const pathIndex = path.findIndex(p => p.r === r && p.c === c);
                if (pathIndex !== -1) {
                    if (pathIndex === 1) cell.classList.add('start-red');
                    else if (pathIndex === 14) cell.classList.add('start-green');
                    else if (pathIndex === 27) cell.classList.add('start-yellow');
                    else if (pathIndex === 40) cell.classList.add('start-blue');
                    if (pathIndex % 7 === 0 && pathIndex !== 0) cell.classList.add('safe');
                }

                // ستون‌های رنگی
                if (c === 6 && r >= 1 && r <= 5) cell.classList.add('home-red');
                if (c === 8 && r >= 7 && r <= 13) cell.classList.add('home-green');
                if (c === 13 && r >= 8 && r <= 12) cell.classList.add('home-yellow');
                if (c === 1 && r >= 6 && r <= 10) cell.classList.add('home-blue');

                // مرکز تخته (مثلث‌های رنگی)
                if (r >= 1 && r <= 5 && c >= 7 && c <= 12) {
                    if (r + c >= 8 && r + c <= 12) cell.classList.add('center-red');
                }
                if (r >= 9 && r <= 13 && c >= 2 && c <= 7) {
                    if (r - c >= 2 && r - c <= 6) cell.classList.add('center-green');
                }
                if (r >= 9 && r <= 13 && c >= 8 && c <= 13) {
                    if (r + c >= 18 && r + c <= 22) cell.classList.add('center-yellow');
                }
                if (r >= 1 && r <= 5 && c >= 2 && c <= 7) {
                    if (c - r >= -3 && c - r <= 1) cell.classList.add('center-blue');
                }

                // نمایش مهره‌ها
                const tokensHere = [];
                for (const [uid, player] of Object.entries(game.players)) {
                    const tokens = player.tokens || [0,0,0,0];
                    for (let i = 0; i < tokens.length; i++) {
                        const pos = tokens[i];
                        if (pos === 0) continue;
                        if (pos >= 1 && pos <= 52) {
                            const p = path[pos - 1];
                            if (p && p.r === r && p.c === c) {
                                tokensHere.push({ uid, color: colorMap[uid]?.color || '#888', isBot: player.isBot, index: i });
                            }
                        }
                        else if (pos >= 53 && pos <= 58) {
                            const colPos = pos - 52;
                            const colorIdx = colorMap[uid]?.colorIndex;
                            if (colorIdx === undefined) continue;
                            const colName = colorNames[colorIdx];
                            let homeR, homeC;
                            if (colName === 'red') { homeR = 1 + colPos - 1; homeC = 6; }
                            else if (colName === 'green') { homeR = 13 - (colPos - 1); homeC = 8; }
                            else if (colName === 'yellow') { homeR = 8; homeC = 13 - (colPos - 1); }
                            else if (colName === 'blue') { homeR = 6 + (colPos - 1); homeC = 1; }
                            if (homeR === r && homeC === c) {
                                tokensHere.push({ uid, color: colorMap[uid]?.color || '#888', isBot: player.isBot, index: i });
                            }
                        }
                    }
                }

                if (tokensHere.length === 1) {
                    const t = tokensHere[0];
                    const tokenEl = document.createElement('div');
                    tokenEl.className = 'token';
                    if (t.uid === myUid) tokenEl.classList.add('me');
                    if (t.isBot) tokenEl.style.opacity = '0.8';
                    tokenEl.style.background = t.color;
                    cell.appendChild(tokenEl);
                } else if (tokensHere.length > 1) {
                    tokensHere.forEach((t, idx) => {
                        const tokenEl = document.createElement('div');
                        tokenEl.className = 'token multiple';
                        tokenEl.style.background = t.color;
                        tokenEl.style.position = 'absolute';
                        tokenEl.style.left = (idx * 30 + 5) + '%';
                        tokenEl.style.top = (idx * 30 + 5) + '%';
                        tokenEl.textContent = idx + 1;
                        cell.appendChild(tokenEl);
                    });
                    cell.style.position = 'relative';
                }

                board.appendChild(cell);
            }
        }

        // لیست بازیکنان
        const playersList = document.getElementById('playersList');
        let listHtml = '';
        for (const [uid, player] of Object.entries(game.players)) {
            const isActive = uid === game.currentTurn;
            const isFinished = player.finished;
            const colorInfo = colorMap[uid] || { color: '#888', colorName: 'نامشخص' };
            listHtml += `
                <div class="player-badge ${isActive ? 'active' : ''} ${isFinished ? 'finished' : ''}">
                    <span class="color-dot" style="background:${colorInfo.color || '#888'}"></span>
                    ${player.name} ${uid === myUid ? '👤' : ''}
                    ${isFinished ? '🏁' : ''}
                </div>
            `;
        }
        playersList.innerHTML = listHtml;

        // تاس
        document.getElementById('diceDisplay').textContent = game.dice ? `🎲 ${game.dice}` : '🎲';

        // اطلاعات
        const currentPlayer = game.players[game.currentTurn];
        const phaseText = game.phase === 'roll' ? 'تاس بینداز' : 'حرکت کن';
        document.getElementById('gameInfo').textContent = `نوبت: ${currentPlayer?.name || ''}  |  ${phaseText}`;

        // دکمه‌ها
        const isMyTurn = game.currentTurn === myUid && game.status === 'playing';
        document.getElementById('rollBtn').disabled = !(isMyTurn && game.phase === 'roll');
        document.getElementById('rollBtn').textContent = game.phase === 'roll' ? 'تاس بینداز' : 'حرکت کن';

        if (game.status === 'finished') {
            document.getElementById('gameInfo').textContent = '🏁 بازی تمام شد!';
            document.getElementById('rollBtn').disabled = true;
            if (game.winner) {
                const winnerName = game.players[game.winner]?.name || '';
                document.getElementById('winnerMessage').textContent = `🏆 برنده: ${winnerName}`;
            }
        } else {
            document.getElementById('winnerMessage').textContent = '';
        }

        // انتخاب رنگ
        if (game.status === 'color_select') {
            document.getElementById('colorSelectOverlay').style.display = 'flex';
            renderColorOptions(game);
        } else {
            document.getElementById('colorSelectOverlay').style.display = 'none';
        }

        // پیام
        if (game.phase === 'move' && isMyTurn) {
            document.getElementById('statusMessage').textContent = '✅ در حال حرکت...';
        } else if (game.status === 'playing' && game.phase === 'roll' && !isMyTurn) {
            document.getElementById('statusMessage').textContent = '⏳ منتظر نوبت دیگران...';
        } else {
            document.getElementById('statusMessage').textContent = '';
        }
    }

    function renderColorOptions(game) {
        const container = document.getElementById('colorOptions');
        const colorMap = game.colorMap || {};
        const myColorInfo = colorMap[myUid];
        const selectedIndex = myColorInfo?.colorIndex;
        const colors = [
            { index: 0, hex: '#ff6b6b', name: 'قرمز' },
            { index: 1, hex: '#69db7c', name: 'سبز' },
            { index: 2, hex: '#ffd43b', name: 'زرد' },
            { index: 3, hex: '#4dabf7', name: 'آبی' }
        ];
        let html = '';
        for (const c of colors) {
            let taken = false;
            let takenBy = null;
            for (const [uid, info] of Object.entries(colorMap)) {
                if (uid !== myUid && info.colorIndex === c.index) {
                    taken = true;
                    takenBy = game.players[uid]?.name || '';
                    break;
                }
            }
            const isSelected = selectedIndex === c.index;
            const disabled = taken && !isSelected;
            html += `
                <div class="color-option ${disabled ? 'disabled' : ''} ${isSelected ? 'selected' : ''}"
                     style="background:${c.hex}"
                     onclick="${disabled ? '' : `selectColor(${c.index})`}"
                     title="${c.name} ${taken ? '(توسط ' + takenBy + ' انتخاب شده)' : ''}">
                </div>
            `;
        }
        container.innerHTML = html;
        const statusEl = document.getElementById('colorStatus');
        if (myColorInfo && myColorInfo.selected) {
            statusEl.textContent = `رنگ شما: ${myColorInfo.colorName}`;
        } else {
            statusEl.textContent = 'یک رنگ انتخاب کنید';
        }
        const timerEl = document.getElementById('colorTimer');
        const remaining = Math.max(0, Math.floor((game.colorSelectionEnd - Date.now()) / 1000));
        timerEl.textContent = remaining;
    }

    function startColorTimer(game) {
        if (colorTimerInterval) clearInterval(colorTimerInterval);
        colorTimerInterval = setInterval(async () => {
            const updatedGame = await getGame(gameId);
            if (!updatedGame || updatedGame.status !== 'color_select') {
                clearInterval(colorTimerInterval);
                return;
            }
            const remaining = Math.max(0, Math.floor((updatedGame.colorSelectionEnd - Date.now()) / 1000));
            document.getElementById('colorTimer').textContent = remaining;
            if (remaining === 0) {
                clearInterval(colorTimerInterval);
                await finalizeMancheColors(gameId);
                const finalGame = await getGame(gameId);
                if (finalGame) renderGame(finalGame);
            }
        }, 1000);
    }

    async function selectColor(colorIndex) {
        try {
            await selectMancheColor(gameId, myUid, colorIndex);
            const game = await getGame(gameId);
            if (game) renderGame(game);
        } catch (e) {
            alert(e.message);
        }
    }

    async function handleRoll() {
        try {
            const dice = await rollDice(gameId, myUid);
            const game = await getGame(gameId);
            if (!game) return;
            renderGame(game);
            if (game.currentTurn === myUid && game.phase === 'move') {
                const player = game.players[myUid];
                let moved = false;
                for (let i = 0; i < player.tokens.length; i++) {
                    try {
                        await moveMancheToken(gameId, myUid, i);
                        moved = true;
                        break;
                    } catch (e) {
                        continue;
                    }
                }
                if (!moved) {
                    alert('هیچ مهره‌ای قابل حرکت نیست');
                    await nextTurn(gameId, myUid, false);
                }
                const updated = await getGame(gameId);
                if (updated) renderGame(updated);
            }
        } catch (e) {
            alert('خطا: ' + e.message);
        }
    }

    async function leaveGame() {
        if (!confirm('آیا از بازی خارج می‌شوید؟')) return;
        try {
            await leaveGame(gameId, myUid);
            if (gameRef) stopPolling(gameRef);
            window.location.href = `lobby.html?id=${currentGame.lobbyId}`;
        } catch (e) {
            alert('خطا: ' + e.message);
        }
    }

    function backToLobby() {
        if (currentGame && currentGame.lobbyId) {
            window.location.href = `lobby.html?id=${currentGame.lobbyId}`;
        } else {
            window.location.href = 'index.html';
        }
    }

    window.addEventListener('beforeunload', function() {
        if (gameRef) stopPolling(gameRef);
        if (colorTimerInterval) clearInterval(colorTimerInterval);
    });
</script>
</body>
</html>
