<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی حکم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .game-container {
    width: 100%;
    max-width: 900px;
    background: rgba(255,255,255,0.05);
    border-radius: 30px;
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 {
    text-align: center;
    color: #f1c40f;
    font-size: 28px;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(241,196,15,0.3);
  }
  .game-info {
    text-align: center;
    color: #ecf0f1;
    font-size: 18px;
    margin-bottom: 20px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 12px;
  }
  .table {
    position: relative;
    width: 100%;
    max-width: 700px;
    height: 500px;
    margin: 0 auto;
    background: radial-gradient(ellipse at center, #2d7d46 0%, #1a4a2e 100%);
    border-radius: 50%;
    border: 8px solid #8B7355;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .center-area {
    text-align: center;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
  }
  .center-area .dice-result {
    font-size: 48px;
    margin: 10px 0;
  }
  .player-slot {
    position: absolute;
    width: 120px;
    text-align: center;
    transform: translate(-50%, -50%);
  }
  .player-slot .name {
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 5px;
  }
  .player-slot .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
  }
  .card {
    width: 50px;
    height: 70px;
    background: #fff;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid #ddd;
    position: relative;
  }
  .card:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .card.selected {
    border-color: #f1c40f;
    box-shadow: 0 0 20px rgba(241,196,15,0.6);
    transform: translateY(-8px);
  }
  .card.bot-card {
    cursor: default;
    opacity: 0.8;
  }
  .card .suit-red { color: #e74c3c; }
  .card .suit-black { color: #2c3e50; }
  .card .small-label {
    position: absolute;
    top: 3px;
    left: 5px;
    font-size: 10px;
    font-weight: 400;
  }
  .actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
  }
  button {
    padding: 12px 30px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Vazirmatn', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    color: #fff;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-play { background: linear-gradient(135deg, #2ecc71, #27ae60); }
  .btn-back { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  .btn-leave { background: linear-gradient(135deg, #f39c12, #e67e22); }
  .result-area {
    margin-top: 15px;
    padding: 10px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    text-align: center;
    color: #f1c40f;
    font-size: 18px;
  }
  .winner-text { color: #f1c40f; font-weight: 700; }

  @media (max-width: 700px) {
    .table { height: 400px; }
    .player-slot { width: 80px; }
    .card { width: 40px; height: 56px; font-size: 14px; }
    .player-slot .name { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="game-container">
  <h1>🃏 بازی حکم</h1>
  <div class="game-info" id="gameInfo">در حال بارگذاری...</div>
  
  <div class="table" id="tableArea">
    <div class="center-area" id="centerArea">
      <div>🎯</div>
      <div id="playedCards" style="font-size: 24px; margin-top: 10px;"></div>
      <div id="lastWinner" style="font-size: 16px; margin-top: 5px; color: #f1c40f;"></div>
    </div>
    <!-- اسلات‌های بازیکنان به صورت دایره‌ای توسط جاوااسکریپت ساخته می‌شوند -->
  </div>

  <div class="actions">
    <button class="btn-play" id="playBtn" onclick="playCard()" disabled>بازی کن</button>
    <button class="btn-leave" onclick="leaveGame()">🔙 خروج از بازی</button>
    <button class="btn-back" onclick="backToLobby()">🔙 لابی</button>
  </div>
  <div class="result-area" id="resultArea"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="api.js"></script>
<script>
let gameId = new URLSearchParams(window.location.search).get('id');
let currentGame = null;
let currentUser = null;
let gameRef = null;
let myUid = null;
let selectedCard = null;

window.onload = async () => {
  currentUser = await getCurrentUser();
  if (!currentUser) {
    window.location.href = 'index.html';
    return;
  }
  myUid = currentUser.id;
  if (!gameId) {
    alert('شناسه بازی پیدا نشد!');
    window.location.href = 'index.html';
    return;
  }
  gameRef = pollGame(gameId, updateGame);
  const game = await getGame(gameId);
  if (game) {
    await initHokmGame(gameId);
    const updated = await getGame(gameId);
    if (updated) renderGame(updated);
  } else {
    alert('بازی پیدا نشد');
    window.location.href = 'index.html';
  }
};

function updateGame(game) {
  if (!game) {
    alert('بازی حذف شد!');
    window.location.href = 'index.html';
    return;
  }
  currentGame = game;
  renderGame(game);
}

function getPosition(index, total) {
  // موقعیت‌های دایره‌ای با فاصله مساوی، از بالا شروع می‌شود (ساعت 12)
  const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
  const radius = 42; // درصد
  const x = 50 + radius * Math.cos(angle);
  const y = 50 + radius * Math.sin(angle);
  return { x, y };
}

function renderGame(game) {
  const playerIds = Object.keys(game.players);
  const table = document.getElementById('tableArea');
  // حذف اسلات‌های قبلی (به جز center-area)
  document.querySelectorAll('.player-slot').forEach(el => el.remove());

  playerIds.forEach((uid, index) => {
    const pos = getPosition(index, playerIds.length);
    const player = game.players[uid];
    const isMe = uid === myUid;
    const isBot = player.isBot;
    const hand = game.cards?.[uid] || [];
    const isTurn = uid === game.currentTurn;

    const slot = document.createElement('div');
    slot.className = 'player-slot';
    slot.style.left = pos.x + '%';
    slot.style.top = pos.y + '%';

    let cardsHtml = '';
    if (isMe) {
      hand.forEach(card => {
        const suit = card.slice(-1);
        const rank = card.slice(0, -1);
        const suitColor = (suit === '♥' || suit === '♦') ? 'suit-red' : 'suit-black';
        const selectedClass = selectedCard === card ? 'selected' : '';
        cardsHtml += `<div class="card ${selectedClass}" onclick="selectCard('${card}')">
          <span class="${suitColor}">${rank}${suit}</span>
        </div>`;
      });
    } else {
      // نمایش کارت‌های بسته برای دیگران
      const count = hand.length;
      cardsHtml = `<span style="color:#ddd;font-size:14px;">${count} کارت</span>`;
    }

    slot.innerHTML = `
      <div class="name">${player.name} ${isMe ? '👤' : ''} ${isTurn ? '⭐' : ''}</div>
      <div class="cards">${cardsHtml}</div>
      <div style="color:#aaa;font-size:12px;margin-top:4px;">امتیاز: ${player.totalScore || 0}</div>
    `;
    table.appendChild(slot);
  });

  // نمایش کارت‌های بازی شده
  const played = game.played || {};
  const playedCardsHtml = Object.values(played).map(c => `<span style="margin:0 5px;">${c}</span>`).join('');
  document.getElementById('playedCards').innerHTML = playedCardsHtml || '—';

  if (game.lastWinner) {
    document.getElementById('lastWinner').textContent = `🏆 برنده دست: ${game.players[game.lastWinner]?.name || ''}`;
  } else {
    document.getElementById('lastWinner').textContent = '';
  }

  const isMyTurn = game.currentTurn === myUid && game.status === 'playing';
  document.getElementById('playBtn').disabled = !isMyTurn || !selectedCard;
  document.getElementById('gameInfo').textContent = `راند ${game.round || 1} - نوبت: ${game.players[game.currentTurn]?.name || ''}`;
  if (game.status === 'finished') {
    document.getElementById('gameInfo').textContent = '🏁 بازی به پایان رسید!';
    document.getElementById('playBtn').disabled = true;
  }
}

function selectCard(card) {
  if (selectedCard === card) {
    selectedCard = null;
  } else {
    selectedCard = card;
  }
  renderGame(currentGame);
}

async function playCard() {
  if (!selectedCard) return;
  try {
    await playHokmCard(gameId, myUid, selectedCard);
    selectedCard = null;
    const game = await getGame(gameId);
    if (game) renderGame(game);
  } catch (e) {
    alert('خطا: ' + e.message);
  }
}

async function leaveGame() {
  if (!confirm('آیا از بازی خارج می‌شوید؟')) return;
  try {
    await leaveGame(gameId, myUid);
    if (gameRef) stopPolling(gameRef);
    window.location.href = `lobby.html?id=${currentGame.lobbyId}`;
  } catch (e) {
    alert('خطا: ' + e.message);
  }
}

function backToLobby() {
  // این دکمه فقط بازگشت به لابی است، بدون خروج از بازی (برای زمانی که کاربر در بازی نیست)
  if (currentGame && currentGame.lobbyId) {
    window.location.href = `lobby.html?id=${currentGame.lobbyId}`;
  } else {
    window.location.href = 'index.html';
  }
}

window.addEventListener('beforeunload', function() {
  if (gameRef) stopPolling(gameRef);
});
</script>
</body>
</html>
